name: Deploy staging site

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Check out staging
        uses: actions/checkout@v5

      - name: Assemble PHP web root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/api

          cp -a public/. deploy/
          cp php/.htaccess deploy/.htaccess
          cp -a php/api/. deploy/api/

          # The upload directory belongs to the server and must not be replaced or deleted.
          rm -rf deploy/uploads

      - name: Verify deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy/index.html
          test -f deploy/.htaccess
          test -f deploy/client.js
          test -f deploy/api/events.php
          test -f deploy/api/config.php
          test ! -e deploy/uploads
          find deploy -maxdepth 3 -type f -print | sort

      - name: Configure SFTP authentication and upload files
        shell: bash
        env:
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_STAGING_DIR: ${{ secrets.SFTP_STAGING_DIR }}
        run: |
          set -euo pipefail

          # Validate all required secrets
          test -n "$SFTP_PRIVATE_KEY" || { echo 'SFTP_PRIVATE_KEY is empty'; exit 1; }
          test -n "$SFTP_KNOWN_HOSTS" || { echo 'SFTP_KNOWN_HOSTS is empty'; exit 1; }
          test -n "$SFTP_USERNAME" || { echo 'SFTP_USERNAME is empty'; exit 1; }
          test -n "$SFTP_HOST" || { echo 'SFTP_HOST is empty'; exit 1; }
          test -n "$SFTP_PORT" || { echo 'SFTP_PORT is empty'; exit 1; }
          test -n "$SFTP_STAGING_DIR" || { echo 'SFTP_STAGING_DIR is empty'; exit 1; }

          # Setup SSH
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SFTP_PRIVATE_KEY" > "$HOME/.ssh/gapi_actions"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/gapi_actions" "$HOME/.ssh/known_hosts"

          # Start SSH agent and add key in the same step
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_PASSPHRASE" | ssh-add "$HOME/.ssh/gapi_actions"

          # Create SFTP batch file
          batch_file="$RUNNER_TEMP/sftp_batch"
          : > "$batch_file"
          printf 'cd "%s"\n' "$SFTP_STAGING_DIR" >> "$batch_file"

          while IFS= read -r directory; do
            relative="${directory#deploy/}"
            if [ "$relative" != "$directory" ]; then
              printf -- '-mkdir "%s"\n' "$relative" >> "$batch_file"
            fi
          done < <(find deploy -type d -print | sort)

          while IFS= read -r file; do
            relative="${file#deploy/}"
            printf 'put "%s" "%s"\n' "$file" "$relative" >> "$batch_file"
          done < <(find deploy -type f -print | sort)

          # Upload files
          sftp -b "$batch_file" \
            -P "$SFTP_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/gapi_actions" \
            "$SFTP_USERNAME@$SFTP_HOST"
