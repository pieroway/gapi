<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Reported Events</title>
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        /* --- Login Overlay --- */
        #login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
        }
        #login-overlay.visible {
            display: flex;
        }
        #login-box {
            background: #fff;
            border-radius: 12px;
            padding: 36px 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        #login-box h2 {
            margin: 0;
            font-size: 1.4rem;
            color: #333;
        }
        #login-box p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
        #login-password {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        #login-password.error {
            border-color: #dc3545;
        }
        #login-error {
            color: #dc3545;
            font-size: 0.85rem;
            display: none;
        }
        #login-remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #555;
        }
        #login-submit {
            padding: 10px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }
        #login-submit:hover { background: #0056b3; }

        /* --- Sticky admin nav bar --- */
        #admin-navbar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 500;
            background: #ffffff;
            color: #333;
            padding: 0 20px;
            height: 56px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
        }
        #admin-navbar.visible { display: flex; }
        /* Push page content below the fixed navbar */
        body:has(#admin-navbar.visible) main {
            padding-top: 30px;
        }
        #admin-navbar .navbar-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: #333;
        }
        #logout-btn {
            padding: 6px 14px;
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        #logout-btn:hover { background: #b02a37; }
    </style>
</head>

<body>

    <!-- Login overlay -->
    <div id="login-overlay" class="visible" role="dialog" aria-modal="true" aria-labelledby="login-title">
        <div id="login-box">
            <h2 id="login-title">🔒 Admin Login</h2>
            <p>Enter your admin password to access the dashboard.</p>
            <input type="password" id="login-password" placeholder="Admin password" autocomplete="current-password">
            <div id="login-error">Incorrect password. Please try again.</div>
            <label id="login-remember">
                <input type="checkbox" id="remember-me-checkbox"> Remember me on this device
            </label>
            <button id="login-submit">Sign In</button>
        </div>
    </div>

    <!-- Sticky admin navbar (shown after login) -->
    <nav id="admin-navbar" aria-label="Admin navigation">
        <span class="navbar-title">🛡️ Admin Dashboard</span>
        <button id="logout-btn" title="Log out of admin panel">Log Out</button>
    </nav>

    <main>
        <h1>Reported Events</h1>
        <div id="dashboard-container">
            <div class="stat-card">
                <h3>Total Active Events</h3>
                <p id="stat-total-events">--</p>
            </div>
            <div class="stat-card">
                <h3>Open Reports</h3>
                <p id="stat-open-reports">--</p>
            </div>
            <div class="stat-card">
                <h3>Reports by Reason</h3>
                <div id="stat-reason-chart"></div>
            </div>
        </div>
        <div class="filter-controls">
            <div class="filter-group">
                <label for="search-input">Search by Title, Address, or Description</label>
                <input type="search" id="search-input" placeholder="Search reports...">
            </div>
            <div class="filter-group">
                <label for="reason-filter">Filter by Reason</label>
                <select id="reason-filter">
                    <option value="all">All Reasons</option>
                    <option value="inaccurate">Inaccurate Information</option>
                    <option value="spam">Spam or Scam</option>
                    <option value="inappropriate">Inappropriate Content</option>
                    <option value="cancelled">Event is not happening/ended</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>
        <div id="reports-container">
            <p class="loading">Loading reports...</p>
        </div>
        <div id="pagination-container"></div>
    </main>

    <div id="edit-event-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Edit Event</h2>
            <form id="edit-event-form">
                <input type="hidden" id="edit-event-id" name="id">
                <div class="form-group">
                    <label for="edit-event-title">Title</label>
                    <input type="text" id="edit-event-title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="edit-event-description">Description</label>
                    <textarea id="edit-event-description" name="description" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-event-address">Address</label>
                    <input type="text" id="edit-event-address" name="address" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-event-start">Start Time</label>
                        <input type="datetime-local" id="edit-event-start" name="start_datetime" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-event-end">End Time</label>
                        <input type="datetime-local" id="edit-event-end" name="end_datetime" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="edit-event-sale-type">Sale Type</label>
                    <select id="edit-event-sale-type" name="sale_type_id" required></select>
                </div>
                <div class="form-group">
                    <label>Item Categories</label>
                    <div id="edit-event-categories-container" class="checkbox-group"></div>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancel-edit-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // =================================================================
        // Admin Authentication
        // =================================================================
        const ADMIN_TOKEN_KEY = 'adminToken';
        const ADMIN_TOKEN_SESSION_KEY = 'adminTokenSession';

        /**
         * Returns the stored admin token from localStorage (remember me)
         * or sessionStorage (session only), or null if not found.
         */
        function getStoredToken() {
            return localStorage.getItem(ADMIN_TOKEN_KEY) || sessionStorage.getItem(ADMIN_TOKEN_SESSION_KEY) || null;
        }

        /**
         * Saves the token. If rememberMe is true, persists to localStorage;
         * otherwise stores in sessionStorage only.
         */
        function saveToken(token, rememberMe) {
            if (rememberMe) {
                localStorage.setItem(ADMIN_TOKEN_KEY, token);
                sessionStorage.removeItem(ADMIN_TOKEN_SESSION_KEY);
            } else {
                sessionStorage.setItem(ADMIN_TOKEN_SESSION_KEY, token);
                localStorage.removeItem(ADMIN_TOKEN_KEY);
            }
        }

        function clearToken() {
            localStorage.removeItem(ADMIN_TOKEN_KEY);
            sessionStorage.removeItem(ADMIN_TOKEN_SESSION_KEY);
        }

        /**
         * Returns fetch options with the Authorization header attached.
         */
        function adminFetchOptions(extraOptions = {}) {
            const token = getStoredToken();
            return {
                ...extraOptions,
                headers: {
                    ...(extraOptions.headers || {}),
                    'Authorization': `Bearer ${token}`
                }
            };
        }

        const loginOverlay = document.getElementById('login-overlay');
        const loginPassword = document.getElementById('login-password');
        const loginError = document.getElementById('login-error');
        const loginSubmit = document.getElementById('login-submit');
        const rememberMeCheckbox = document.getElementById('remember-me-checkbox');
        const logoutBtn = document.getElementById('logout-btn');

        const adminNavbar = document.getElementById('admin-navbar');

        function showLogin() {
            loginOverlay.classList.add('visible');
            adminNavbar.classList.remove('visible');
            loginPassword.value = '';
            loginError.style.display = 'none';
            setTimeout(() => loginPassword.focus(), 100);
        }

        function hideLogin() {
            loginOverlay.classList.remove('visible');
            adminNavbar.classList.add('visible');
        }

        async function attemptLogin() {
            const password = loginPassword.value.trim();
            if (!password) return;

            loginSubmit.disabled = true;
            loginSubmit.textContent = 'Signing in...';

            // Validate the token against the server by making a test request
            try {
                const res = await fetch('/api/reports', {
                    headers: { 'Authorization': `Bearer ${password}` }
                });

                if (res.ok) {
                    saveToken(password, rememberMeCheckbox.checked);
                    hideLogin();
                    // Kick off the main data load now that we're authenticated
                    fetchInitialData();
                } else {
                    loginError.style.display = 'block';
                    loginPassword.classList.add('error');
                    loginPassword.select();
                }
            } catch (err) {
                loginError.textContent = 'Could not reach the server. Please try again.';
                loginError.style.display = 'block';
            } finally {
                loginSubmit.disabled = false;
                loginSubmit.textContent = 'Sign In';
            }
        }

        loginSubmit.addEventListener('click', attemptLogin);
        loginPassword.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') attemptLogin();
            loginPassword.classList.remove('error');
            loginError.style.display = 'none';
        });

        logoutBtn.addEventListener('click', () => {
            clearToken();
            showLogin();
        });

        // =================================================================
        // Main Admin Logic
        // =================================================================
        document.addEventListener('DOMContentLoaded', () => {
            const reportsContainer = document.getElementById('reports-container');
            const searchInput = document.getElementById('search-input');
            const reasonFilter = document.getElementById('reason-filter');
            const paginationContainer = document.getElementById('pagination-container');
            const editModal = document.getElementById('edit-event-modal');
            const editForm = document.getElementById('edit-event-form');
            const cancelEditBtn = document.getElementById('cancel-edit-btn');

            let allReports = [];
            let allCategories = [];
            let allSaleTypes = [];
            let totalActiveEvents = 0;
            let currentPage = 1;
            const reportsPerPage = 10;

            function filterAndRenderReports() {
                const searchTerm = searchInput.value.toLowerCase().trim();
                const selectedReason = reasonFilter.value;

                const filteredReports = allReports.filter(report => {
                    const reasonMatch = selectedReason === 'all' || report.reason === selectedReason;

                    const searchMatch = !searchTerm ||
                        (report.event.title && report.event.title.toLowerCase().includes(searchTerm)) ||
                        (report.event.address && report.event.address.toLowerCase().includes(searchTerm)) ||
                        (report.event.description && report.event.description.toLowerCase().includes(searchTerm));

                    return reasonMatch && searchMatch;
                });

                // If the current page is now out of bounds after filtering, reset to the last valid page.
                const totalPages = Math.ceil(filteredReports.length / reportsPerPage);
                if (currentPage > totalPages && totalPages > 0) {
                    currentPage = totalPages;
                }

                renderReports(filteredReports);
                renderPagination(filteredReports);
            }

            function debounce(func, delay) {
                let timeoutId;
                return function(...args) {
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(() => {
                        func.apply(this, args);
                    }, delay);
                };
            }

            const debouncedFilter = debounce(() => {
                currentPage = 1;
                filterAndRenderReports();
            }, 300);

            searchInput.addEventListener('input', debouncedFilter);

            reasonFilter.addEventListener('change', () => {
                currentPage = 1;
                filterAndRenderReports();
            });

            function updateDashboardStats() {
                document.getElementById('stat-total-events').textContent = totalActiveEvents;
                document.getElementById('stat-open-reports').textContent = allReports.length;

                const reasonCounts = allReports.reduce((acc, report) => {
                    acc[report.reason] = (acc[report.reason] || 0) + 1;
                    return acc;
                }, {});

                const reasonChartContainer = document.getElementById('stat-reason-chart');
                reasonChartContainer.innerHTML = '';

                if (Object.keys(reasonCounts).length === 0) {
                    reasonChartContainer.innerHTML = '<p style="text-align:center; color:#999;">No reports to show.</p>';
                    return;
                }

                const maxCount = Math.max(...Object.values(reasonCounts));

                Object.entries(reasonCounts)
                    .sort(([, a], [, b]) => b - a)
                    .forEach(([reason, count]) => {
                        const barPercentage = maxCount > 0 ? (count / maxCount) * 100 : 0;
                        const row = document.createElement('div');
                        row.className = 'chart-row';
                        row.innerHTML = `
                            <div class="chart-label" title="${reason.replace(/_/g, ' ')}">${reason.replace(/_/g, ' ')}</div>
                            <div class="chart-bar-wrapper">
                                <div class="chart-bar" style="width: ${barPercentage}%;">
                                    <span>${count}</span>
                                </div>
                            </div>
                        `;
                        reasonChartContainer.appendChild(row);
                    });
            }

            async function fetchInitialData() {
                reportsContainer.innerHTML = '<p class="loading">Loading reports...</p>';
                try {
                    const [reportsRes, categoriesRes, saleTypesRes, eventsRes] = await Promise.all([
                        fetch('/api/reports', adminFetchOptions()),
                        fetch('/api/item_categories'),
                        fetch('/api/sale_types'),
                        fetch('/api/events')
                    ]);

                    // If the reports request returns 401, the stored token is stale — show login again.
                    if (reportsRes.status === 401) {
                        clearToken();
                        showLogin();
                        return;
                    }

                    if (!reportsRes.ok || !categoriesRes.ok || !saleTypesRes.ok || !eventsRes.ok) {
                        throw new Error('HTTP error during initial data fetch.');
                    }

                    allReports = await reportsRes.json();
                    allCategories = await categoriesRes.json();
                    allSaleTypes = await saleTypesRes.json();
                    const allActiveEvents = await eventsRes.json();
                    totalActiveEvents = allActiveEvents.length;

                    populateEditFormDropdowns();
                    updateDashboardStats();
                    filterAndRenderReports();
                } catch (error) {
                    console.error('Failed to fetch initial data:', error);
                    reportsContainer.innerHTML = '<p class="no-reports">Could not load reports. Please try again later.</p>';
                }
            }

            function renderReports(reports) {
                reportsContainer.innerHTML = '';

                if (reports.length === 0) {
                    reportsContainer.innerHTML = '<p class="no-reports">No reports match the current filters.</p>';
                    return;
                }

                const startIndex = (currentPage - 1) * reportsPerPage;
                const endIndex = startIndex + reportsPerPage;
                const paginatedReports = reports.slice(startIndex, endIndex);

                paginatedReports.forEach(report => {
                    const card = document.createElement('div');
                    card.className = 'report-card';
                    card.dataset.reportId = report.id;
                    card.dataset.eventId = report.event.id;

                    card.innerHTML = `
                        <div>
                            <h2>
                                <span>${report.event.title}</span>
                                <a href="/client.html?event=${report.event.id}" target="_blank" class="view-on-map-link" title="View on Map">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                                </a>
                            </h2>
                            <p><strong>Event ID:</strong> ${report.event.id}</p>
                        </div>
                        <div class="event-details">
                            <p><strong>Address:</strong> ${report.event.address}</p>
                            <p><strong>Description:</strong> ${report.event.description}</p>
                        </div>
                        <div class="report-details">
                            <p><strong>Report Reason:</strong> ${report.reason}</p>
                            <p><strong>Details:</strong> ${report.details || 'N/A'}</p>
                            <p><strong>Reported At:</strong> ${new Date(report.created_at).toLocaleString()}</p>
                        </div>
                        <div class="actions">
                            <button class="btn-dismiss">Dismiss Report</button>
                            <button class="btn-edit">Edit Event</button>
                            <button class="btn-delete">Delete Event</button>
                        </div>
                    `;

                    card.querySelector('.btn-dismiss').addEventListener('click', () => handleDismiss(report.id));
                    card.querySelector('.btn-delete').addEventListener('click', () => handleDelete(report.event.id));
                    card.querySelector('.btn-edit').addEventListener('click', () => openEditModal(report.event));

                    reportsContainer.appendChild(card);
                });
            }

            function renderPagination(reports) {
                paginationContainer.innerHTML = '';
                const pageCount = Math.ceil(reports.length / reportsPerPage);

                if (pageCount <= 1) return;

                const prevButton = document.createElement('button');
                prevButton.textContent = 'Previous';
                prevButton.disabled = currentPage === 1;
                prevButton.addEventListener('click', () => {
                    if (currentPage > 1) { currentPage--; filterAndRenderReports(); }
                });
                paginationContainer.appendChild(prevButton);

                const pagesToShow = new Set();
                const win = 1;
                pagesToShow.add(1);
                pagesToShow.add(pageCount);
                for (let i = currentPage - win; i <= currentPage + win; i++) {
                    if (i > 0 && i <= pageCount) pagesToShow.add(i);
                }

                const sortedPages = Array.from(pagesToShow).sort((a, b) => a - b);
                let lastPage = 0;
                sortedPages.forEach(page => {
                    if (page > lastPage + 1) {
                        const ellipsis = document.createElement('span');
                        ellipsis.textContent = '...';
                        ellipsis.style.cssText = 'padding:8px 6px;color:#6c757d;user-select:none;';
                        paginationContainer.appendChild(ellipsis);
                    }
                    const pageButton = document.createElement('button');
                    pageButton.textContent = page;
                    if (page === currentPage) pageButton.classList.add('active');
                    pageButton.addEventListener('click', () => { currentPage = page; filterAndRenderReports(); });
                    paginationContainer.appendChild(pageButton);
                    lastPage = page;
                });

                const nextButton = document.createElement('button');
                nextButton.textContent = 'Next';
                nextButton.disabled = currentPage === pageCount;
                nextButton.addEventListener('click', () => {
                    if (currentPage < pageCount) { currentPage++; filterAndRenderReports(); }
                });
                paginationContainer.appendChild(nextButton);
            }

            async function handleDismiss(reportId) {
                if (!confirm('Are you sure you want to dismiss this report? The event will remain active.')) return;
                try {
                    const response = await fetch(`/api/reports/${reportId}`, adminFetchOptions({ method: 'DELETE' }));
                    if (response.status === 401) { clearToken(); showLogin(); return; }
                    if (!response.ok) throw new Error('Failed to dismiss report.');
                    allReports = allReports.filter(report => report.id !== reportId);
                    updateDashboardStats();
                    filterAndRenderReports();
                } catch (error) {
                    console.error('Dismiss error:', error);
                    alert('Could not dismiss the report.');
                }
            }

            async function handleDelete(eventId) {
                if (!confirm('Are you sure you want to permanently DELETE this event? This action cannot be undone.')) return;
                try {
                    const response = await fetch(`/api/events/${eventId}`, adminFetchOptions({ method: 'DELETE' }));
                    if (response.status === 401) { clearToken(); showLogin(); return; }
                    if (!response.ok) throw new Error('Failed to delete event.');
                    totalActiveEvents--;
                    allReports = allReports.filter(report => report.event.id !== eventId);
                    updateDashboardStats();
                    filterAndRenderReports();
                } catch (error) {
                    console.error('Delete error:', error);
                    alert('Could not delete the event.');
                }
            }

            function populateEditFormDropdowns() {
                const saleTypeSelect = document.getElementById('edit-event-sale-type');
                const categoriesContainer = document.getElementById('edit-event-categories-container');

                saleTypeSelect.innerHTML = '';
                allSaleTypes.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type.id;
                    option.textContent = type.name;
                    saleTypeSelect.appendChild(option);
                });

                categoriesContainer.innerHTML = '';
                allCategories.forEach(category => {
                    const label = document.createElement('label');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.name = 'item_categories';
                    checkbox.value = category.id;
                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(` ${category.name}`));
                    categoriesContainer.appendChild(label);
                });
            }

            function openEditModal(event) {
                const formatDateTimeLocal = (isoString) => {
                    if (!isoString) return '';
                    const date = new Date(isoString);
                    date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
                    return date.toISOString().slice(0, 16);
                };

                document.getElementById('edit-event-id').value = event.id;
                document.getElementById('edit-event-title').value = event.title;
                document.getElementById('edit-event-description').value = event.description;
                document.getElementById('edit-event-address').value = event.address;
                document.getElementById('edit-event-start').value = formatDateTimeLocal(event.start_datetime);
                document.getElementById('edit-event-end').value = formatDateTimeLocal(event.end_datetime);
                document.getElementById('edit-event-sale-type').value = event.sale_type_id;

                const categoryCheckboxes = document.querySelectorAll('#edit-event-categories-container input[type="checkbox"]');
                categoryCheckboxes.forEach(checkbox => {
                    checkbox.checked = event.item_categories.includes(parseInt(checkbox.value));
                });

                editModal.classList.add('visible');
            }

            cancelEditBtn.addEventListener('click', () => editModal.classList.remove('visible'));

            editModal.addEventListener('click', (e) => {
                if (e.target === editModal) editModal.classList.remove('visible');
            });

            editForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const eventId = document.getElementById('edit-event-id').value;
                const formData = new FormData(editForm);

                const payload = {
                    title: formData.get('title'),
                    description: formData.get('description'),
                    address: formData.get('address'),
                    start_datetime: new Date(formData.get('start_datetime')).toISOString(),
                    end_datetime: new Date(formData.get('end_datetime')).toISOString(),
                    sale_type_id: parseInt(formData.get('sale_type_id')),
                    item_categories: formData.getAll('item_categories').map(id => parseInt(id))
                };

                try {
                    const response = await fetch(`/api/events/${eventId}`, adminFetchOptions({
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    }));

                    if (response.status === 401) { clearToken(); showLogin(); return; }
                    if (!response.ok) throw new Error('Failed to update event.');

                    const updatedEvent = await response.json();
                    allReports.forEach(report => {
                        if (report.event.id === updatedEvent.id) report.event = updatedEvent;
                    });
                    filterAndRenderReports();
                    editModal.classList.remove('visible');
                } catch (error) {
                    console.error('Update error:', error);
                    alert('Could not update the event.');
                }
            });

            // --- Boot sequence ---
            // Check if we already have a stored token; if so, skip the login overlay.
            const storedToken = getStoredToken();
            if (storedToken) {
                hideLogin();
                fetchInitialData();
            } else {
                showLogin();
                // Don't load data yet — wait until login succeeds.
                reportsContainer.innerHTML = '';
            }
        });
    </script>
</body>

</html>
