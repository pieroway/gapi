services:

  # ---------------------------------------------------------------
  # PHP/Apache web application
  # ---------------------------------------------------------------
  app:
    build:
      context: ..          # Build context is the project root so we can
                           # access both php/ and public/ folders
      dockerfile: php/Dockerfile
    ports:
      - "127.0.0.1:${GAPI_HTTP_PORT:-8080}:80"          # Visit http://localhost:8080 in your browser
    environment:
      # Read directly by api/config.php; source files are never rewritten.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: gapi_user
      DB_PASSWORD: gapi_password
      DB_NAME: gapi
      # Google Maps API key — set this to your key (or use a .env file)
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      # Mount uploads folder so photos persist between container restarts
      - uploads_data:/var/www/html/uploads
      # Mount api/ folder for live editing during development
      # (comment this out for a production-like test)
      - ./api:/var/www/html/api:ro
      # Mount frontend entries individually: a read-only document-root mount
      # prevents Docker Desktop from creating the sibling api/uploads mounts.
      - ../public/index.html:/var/www/html/index.html:ro
      - ../public/admin.html:/var/www/html/admin.html:ro
      - ../public/client.js:/var/www/html/client.js:ro
      - ../public/service-worker.js:/var/www/html/service-worker.js:ro
      - ../public/markercluster.js:/var/www/html/markercluster.js:ro
      - ../public/manifest.json:/var/www/html/manifest.json:ro
      - ../public/.htaccess:/var/www/html/.htaccess:ro
      - ../public/css:/var/www/html/css:ro
      - ../public/images:/var/www/html/images:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/config') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------
  # MySQL database
  # ---------------------------------------------------------------
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: gapi
      MYSQL_USER: gapi_user
      MYSQL_PASSWORD: gapi_password
    volumes:
      # Persist database data between container restarts
      - db_data:/var/lib/mysql
      # Auto-run the schema SQL on first startup
      - ./initializedb.sql:/docker-entrypoint-initdb.d/initializedb.sql:ro
    ports:
      - "127.0.0.1:${GAPI_DB_PORT:-3308}:3306"        # Exposed on 3308 to avoid conflict with other containers on 3307
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "gapi_user", "-pgapi_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
